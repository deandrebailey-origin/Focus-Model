server {
    listen 80; # listen on port 80
    root /usr/share/nginx.html; 
    index index.html;

    # sreve files from the folder we copies dist into
    # and uses index.html;

    client_max_body_size 5m;

    # allows request bodies up to 5 mb nginx default is only 1MB
    # and web base cam fram can exceed that so nginx would reject it with 413
    # before it reaches 413

    location /api/ {
        proxy_pass http://api:8000/;
    }

    # api is a hostname in docker-compose each service can reach
    # can reach the otehrs by service name
    # so apu will resolve to you api container

    #trailing / is for eplacing /api/ with / so it become /predict-focus

    location / {
        try_fule $uri /index.html
    }
}